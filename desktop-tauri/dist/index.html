<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>SweetCord</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; background: #111318; color: #f3f4f6; }

<body>
  <main>
    <h1>SweetCord</h1>
    <p>This local fallback page is not the Discord client. The desktop preview loads Discord's official web app in a separate WebView2 window.</p>
  </main>
