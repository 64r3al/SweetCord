name: SweetCord Desktop Website

on:
  push:
    branches: [main]
    paths:
      - "desktop-site/**"
      - ".github/workflows/desktop-site.yml"
  pull_request:
    paths:
      - "desktop-site/**"
      - ".github/workflows/desktop-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sweetcord-desktop-site
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check JavaScript syntax
        run: node --check desktop-site/app.js

      - name: Validate HTML structure and required local files
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path("desktop-site")
          required = ["index.html", "styles.css", "app.js", "favicon.svg", "README.md", "PROJECT_PLAN.md"]
          missing = [name for name in required if not (root / name).is_file()]
          if missing:
              raise SystemExit(f"Missing website files: {', '.join(missing)}")

          class DocumentCheck(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.errors = []
                  self.ids = set()
                  self.references = []
                  self.headings = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      if attrs["id"] in self.ids:
                          self.errors.append(f"Duplicate id: {attrs['id']}")
                      self.ids.add(attrs["id"])
                  if tag == "h1":
                      self.headings.append(tag)
                  for attr in ("src", "href"):
                      value = attrs.get(attr, "")
                      if value.startswith("./") and not value.startswith("./#"):
                          self.references.append(value[2:].split("#", 1)[0].split("?", 1)[0])
              def handle_endtag(self, tag):
                  pass

          parser = DocumentCheck()
          parser.feed((root / "index.html").read_text(encoding="utf-8"))
          parser.close()
          if parser.errors:
              raise SystemExit("\n".join(parser.errors))
          if len(parser.headings) != 1:
              raise SystemExit(f"Expected exactly one H1, found {len(parser.headings)}")
          for path in parser.references:
              if path and not (root / path).is_file():
                  raise SystemExit(f"Missing local asset referenced by HTML: {path}")
          print("Website structure and local asset checks passed.")
          PY

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: desktop-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
