name: SweetCord desktop shell

# A single writer prevents concurrent builds from racing on the mutable nightly tag/release asset.
concurrency:
  group: sweetcord-nightly-release
  cancel-in-progress: false

on:
  push:
    paths:
      - "desktop-electron/**"
      - "desktop-tauri/**"
      - "Launch SweetCord Desktop.bat"
      - ".github/workflows/desktop-shell.yml"
  pull_request:
    paths:
      - "desktop-electron/**"
      - "desktop-tauri/**"
      - "Launch SweetCord Desktop.bat"
      - ".github/workflows/desktop-shell.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-package:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-electron/package.json

      - name: Check JavaScript syntax
        run: node --check desktop-electron/main.cjs

      - name: Install desktop dependencies
        run: npm install --prefix desktop-electron

      - name: Build Windows installer
        run: npm run package:win --prefix desktop-electron

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SweetCord-Windows-Installer
          path: desktop-electron/release/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Move nightly tag to this build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force

      - name: Publish the downloadable Windows preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: SweetCord Desktop — Latest Preview
          target_commitish: ${{ github.sha }}
          body: |
            **Preview build for testing — not a stable release.**

            Download the Windows installer below, run it, and sign in on Discord's official page.

            This app wraps Discord's own web app in a SweetCord-branded Electron window. Its performance profile reduces decorative effects and batches avatar handling, but CSS/CDN tweaks are best-effort and may need updates as Discord changes. No fixed CPU, RAM, or GPU savings are guaranteed; compare locally on the same hardware.

            SweetCord is an unofficial third-party client and is not affiliated with Discord. Third-party client modifications may carry account and Terms of Service risks.
          prerelease: true
          make_latest: false
          files: desktop-electron/release/*.exe
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
