name: SweetCord desktop shell

on:
  push:
    paths:
      - "desktop-electron/**"
      - "Launch SweetCord Desktop.bat"
      - ".github/workflows/desktop-shell.yml"
  pull_request:
    paths:
      - "desktop-electron/**"
      - "Launch SweetCord Desktop.bat"
      - ".github/workflows/desktop-shell.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-electron/package.json

      - name: Check JavaScript syntax
        run: |
          node --check desktop-electron/main.cjs
          node --check desktop-electron/lean-mode.cjs
          node --check desktop-electron/resource-policy.cjs
          node --check desktop-electron/permission-policy.cjs
          node --check desktop-electron/performance-policy.cjs
          node --check desktop-electron/test/lean-mode.test.cjs
          node --check desktop-electron/test/resource-policy.test.cjs
          node --check desktop-electron/test/permission-policy.test.cjs
          node --check desktop-electron/test/performance-policy.test.cjs

      - name: Install desktop dependencies
        run: npm install --prefix desktop-electron

      - name: Run lean-mode regression tests
        run: npm test --prefix desktop-electron

      - name: Build Windows installer
        run: npm run package:win --prefix desktop-electron

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: SweetCord-Windows-Installer
          path: desktop-electron/release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish-nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows-package
    runs-on: ubuntu-latest
    # Serialize only the writer of the mutable nightly tag/release; PR builds can run in parallel.
    concurrency:
      group: sweetcord-nightly-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out source for tagging
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v8
        with:
          name: SweetCord-Windows-Installer
          path: desktop-electron/release

      - name: Move nightly tag to this build
        shell: bash
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force

      - name: Publish the downloadable Windows preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: SweetCord Desktop — Latest Preview
          target_commitish: ${{ github.sha }}
          body: |
            **Preview build for testing — not a stable release.**

            Download the Windows installer below, run it, and sign in on Discord's official page.

            This app wraps Discord's own web app in a SweetCord-branded Electron window. Extreme Lite blocks images and clearly identified video assets; Balanced allows still images while blocking recognizable GIF/APNG/video assets; Custom exposes individual controls. Microphone-only voice calls are preserved; camera and screen capture are denied. Ambiguous media URLs are allowed to protect voice compatibility. The Discord web client and Chromium still run; there is no hard RAM cap, and resource savings must be measured on the target PC.

            SweetCord is an unofficial third-party client and is not affiliated with Discord. Third-party client modifications may carry account and Terms of Service risks.
          prerelease: true
          make_latest: false
          files: desktop-electron/release/*.exe
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-versioned-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows-package
    runs-on: ubuntu-latest
    concurrency:
      group: sweetcord-versioned-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read desktop version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./desktop-electron/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version tag already exists
        id: version-tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v8
        with:
          name: SweetCord-Windows-Installer
          path: desktop-electron/release

      - name: Publish versioned desktop preview
        if: steps.version-tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SweetCord Desktop v${{ steps.version.outputs.version }} — Performance Profiles Preview
          target_commitish: ${{ github.sha }}
          body: |
            **Versioned preview release — not a stable release.**

            This build starts in Extreme Lite. Extreme Lite blocks images and clearly identified video assets; Balanced allows still images while blocking recognizable GIF/APNG/video assets; Custom exposes individual controls. Visual extras and promotions are reduced, microphone-only audio calls are preserved, and camera/display capture are denied. Ambiguous media URLs are allowed to protect voice compatibility.

            **Memory note:** This wrapper cannot enforce a hard 1 GiB total-memory ceiling without risking renderer or app crashes. The Discord web client and Electron/Chromium remain active. Compare the packaged installer with official Discord on the same Windows PC before drawing conclusions about CPU, GPU or RAM savings.

            To test, download the Windows installer below. Choose **Performance → Extreme Lite / Balanced / Custom** based on your preference. Profile changes reload Discord so filtering applies consistently. Video and screen sharing remain disabled.

            SweetCord is unofficial and not affiliated with Discord. Third-party client modifications may carry account and Terms of Service risks.
          prerelease: true
          make_latest: false
          files: desktop-electron/release/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
